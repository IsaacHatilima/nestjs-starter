info:
  name: Resend verification
  type: http
  seq: 3

http:
  method: POST
  url: '{{baseUrl}}/auth/resend-verification'
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Replaces the pending verification token and queues a fresh link for delivery. Valid requests answer 200 with null
  data, including unknown and already verified accounts. Paste the emailed token into the body of Verify email.

  Errors: VALIDATION_ERROR, BAD_REQUEST, RATE_LIMITED, INTERNAL_ERROR.
