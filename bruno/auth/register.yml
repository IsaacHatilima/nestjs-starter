info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: '{{baseUrl}}/auth/register'
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}",
        "firstName": "Isaac",
        "lastName": "Hatilima"
      }
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 201

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates an unverified account, its profile, the verification token and a pending email in one transaction. Returns
  201 with User data; delivery is retried after commit. With MAIL_DRIVER=log the worker prints the link; paste its
  token into the body of Verify email.

  Errors: VALIDATION_ERROR, PASSWORD_COMPROMISED, EMAIL_ALREADY_REGISTERED.
