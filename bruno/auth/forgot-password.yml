info:
  name: Forgot password
  type: http
  seq: 8

http:
  method: POST
  url: '{{baseUrl}}/auth/forgot-password'
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 204

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Emails a password reset link. Always 204. Copy the token from the link into the `resetToken` variable.
