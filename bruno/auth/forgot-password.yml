info:
  name: Forgot password
  type: http
  seq: 8

http:
  method: POST
  url: '{{baseUrl}}/auth/forgot-password'
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Queues a password reset email for delivery after the token is committed. Valid requests answer 200 with null data,
  including unknown addresses. Paste the token from the emailed link into the body of Reset password.

  Errors: VALIDATION_ERROR, BAD_REQUEST, RATE_LIMITED, INTERNAL_ERROR.
