info:
  name: Verify two-factor
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/auth/verify-two-factor"
  body:
    type: json
    data: |-
      {
        "challengeToken": "{{challengeToken}}",
        "code": "756905"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.body.data ?? {};
        if (data.status === "authenticated") {
          bru.setVar("accessToken", data.accessToken);
          bru.setVar("refreshToken", data.refreshToken);
        } else if (data.status === "two_factor_required") {
          bru.setVar("challengeToken", data.challengeToken);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Second login step. `code` is a 6-digit authenticator code or an unused recovery code. Uses the challenge token stored
  by Login.

  Errors: INVALID_TOKEN, TOKEN_EXPIRED, TWO_FACTOR_NOT_ENABLED, INVALID_TWO_FACTOR_CODE.
