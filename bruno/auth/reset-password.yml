info:
  name: Reset password
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "token": "SK2SqzzM2FepDg2Ld7CG2K9m7nDF_jPBXZDiOck8I84",
        "password": "{{password}}"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Sets a new password from the reset token (single use, pasted into `token` above), marks the email verified and signs every session out.

  Errors: INVALID_TOKEN, PASSWORD_COMPROMISED.
