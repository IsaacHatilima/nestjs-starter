info:
  name: Revoke other sessions
  type: http
  seq: 9

http:
  method: POST
  url: '{{baseUrl}}/auth/revoke-other-sessions'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 204

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Signs out everywhere else; the current session stays valid.
