info:
  name: Me
  type: http
  seq: 2

http:
  method: GET
  url: '{{baseUrl}}/auth/me'
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The signed-in user: id, email, emailVerified, twoFactorEnabled, profile, createdAt, updatedAt. `profile` carries
  firstName, lastName and avatarUrl.

  Errors: INVALID_TOKEN, SESSION_REVOKED.
