info:
  name: Disable TOTP
  type: http
  seq: 5

http:
  method: POST
  url: '{{baseUrl}}/auth/disable-totp'
  body:
    type: json
    data: |-
      {
        "password": "{{password}}",
        "code": "275109"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Turns two-factor off. Requires the password and a current code (or recovery code).

  Errors: TWO_FACTOR_NOT_ENABLED, INVALID_CREDENTIALS, INVALID_TWO_FACTOR_CODE.
