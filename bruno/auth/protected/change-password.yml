info:
  name: Change password
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/change-password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "{{password}}",
        "newPassword": "tihbyv-2deqku-cYjked"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Changes the password of the signed-in user and revokes every other session; the current session stays valid.

  Errors: INVALID_CREDENTIALS, PASSWORD_COMPROMISED.
