info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: '{{baseUrl}}/health'
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Liveness check. Answers `{ "success": true, "data": { "status": "ok" }, "error": null }`.
  Does not query PostgreSQL. Use `/health/readiness` to check dependency availability.
  No route-specific error codes.
